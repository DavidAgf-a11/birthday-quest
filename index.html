<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3edff" />
    <meta
      name="description"
      content="Твой день. Твоё приключение. Три волшебных испытания в Birthday Quest: Level 12."
    />
    <title>Birthday Quest · Level 12</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="loader" class="loader" role="status">
      <img src="./assets/icon.svg" alt="" width="64" height="64" /><strong
        >Собираем волшебство…</strong
      ><span class="loading-track"></span>
    </div>
    <div class="sky" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Birthday Quest — главная"
        ><img src="./assets/icon.svg" alt="" width="36" height="36" /><span
          >BIRTHDAY<span>QUEST</span></span
        ></a
      >
      <div class="header-tools">
        <span class="level-badge">LVL <b>12</b></span
        ><button
          id="sound-toggle"
          class="icon-button"
          aria-label="Включить музыку и звуки"
          aria-pressed="false"
        ></button>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="site-footer">
      <span class="tiny-spark">✦</span> Сделано с любовью старшим братом
      <span class="footer-dot">·</span
      ><span>Твой новый уровень начинается здесь</span>
    </footer>
    <div id="toast" class="toast" role="status"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <div id="modal-root"></div>
    <noscript
      ><p class="noscript">
        Для приключения нужен JavaScript. Включи его в настройках браузера.
      </p></noscript
    >
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
